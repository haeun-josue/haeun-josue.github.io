# GitHub Pages(Jekyll) 설정
#
# Jekyll 은 `_` 로 시작하는 폴더(_includes 등)를 배포 결과물에 넣지 않습니다.
# 사진을 _includes/<챕터>/imgs/ 안에 두기 때문에, 그 폴더가 배포되도록 여기서 예외로 지정합니다.
# 조각 HTML(_includes/<챕터>/<챕터>.html)은 include 태그로만 쓰이므로 정적 파일로는 내보내지 않습니다.
include:
  - _includes
exclude:
  - _includes/*/*.html
  - build_preview.sh
  - preview_local.html
  - README.md
